[project]
name = "menu-restaurantes-ia"
description = "Motor de menús impresos: del dato al PDF que la imprenta acepta"
version = "0.1.0"
requires-python = ">=3.9"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Mao Parceros" }]
keywords = ["menu", "restaurante", "imprenta", "cmyk", "pdf", "prepress"]

dependencies = [
  "PyMuPDF>=1.23",      # leer y escribir el PDF, las cajas y las marcas
  "Pillow>=10.0",       # rasterizado del fondo y separación a CMYK
  "numpy>=1.24",        # cobertura de tinta y compresión de gama
  "playwright>=1.40",   # el MISMO motor que pinta los PNG pinta el PDF
]

[project.scripts]
menu-ia = "menu_ia.hacer:main"

[build-system]
requires = ["setuptools>=61"]   # 61 es donde setuptools acepta pyproject solo
build-backend = "setuptools.build_meta"

# ⚠️ Descubrimiento automático, NO una lista a mano.
# La lista decía `menu_ia.idiomas`, y ese paquete se renombró a `variantes`
# hace commits. Nadie lo notó porque la instalación de desarrollo era
# editable y anterior al cambio: **el paquete llevaba desde entonces sin
# poder construirse**, y solo se vio al instalarlo en una máquina limpia.
[tool.setuptools.packages.find]
include = ["menu_ia*"]

[tool.setuptools.package-data]
menu_ia = ["*.css"]
